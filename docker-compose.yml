version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: taqtiq-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  ml-service:
    build: ./ml-service
    container_name: taqtiq-ml
    ports:
      - "5001:5001"
    restart: unless-stopped

  server:
    # Built from the repo root so the image also contains ./database, which the
    # API reads the CSV dumps and fixtures from when it boots.
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: taqtiq-server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:5173
      MONGO_URI: mongodb://mongo:27017/taqtiq
      SPORTSDB_BASE_URL: https://www.thesportsdb.com/api/v1/json
      SPORTSDB_API_KEY: "123"
      ML_SERVICE_URL: http://ml-service:5001
      CACHE_TTL_MINUTES: 360
    depends_on:
      - mongo
      - ml-service
    restart: unless-stopped

  client:
    build: ./client
    container_name: taqtiq-client
    ports:
      - "5173:5173"
    environment:
      # Inside the container "localhost" is the client itself; the API is a
      # sibling service.
      VITE_API_PROXY: http://server:5000
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo-data:
